services:
  - type: web
    name: voc-experience-anomaly-agent
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_SEED
        value: "20260702"
      - key: DEMO_DETERMINISTIC
        value: "true"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_USE_ENV_PROXY
        value: "false"
      - key: LLM_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: LLM_READ_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_RETRIES
        value: "1"
      # 前端来源（GitHub Pages / 本地开发），逗号分隔；有需要时可在控制台覆盖
      - key: CORS_ORIGINS
        value: "https://csijia020-wq.github.io,http://localhost:8000,http://localhost:8080"
    # 注意：DEEPSEEK_API_KEY 为敏感变量，请在 Render 控制台
    # （Dashboard -> 服务 -> Environment）手动配置，不要写入本文件或提交到仓库。
